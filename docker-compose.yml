services:
  postgres:
    image: postgres:16
    container_name: ag_sound_calc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ag_sound_calc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ag_sound_calc_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ag_sound_calc"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend (Express + tsx watch) в контейнере. Слушает :3006.
  # Образ собирается из backend/Dockerfile (стадия dev): tsx + prisma CLI +
  # chromium для PDF. Исходники монтируются bind-mount'ом (hot-reload), а
  # node_modules и кэш Chromium — named volume'ы (инициализируются из образа,
  # чтобы не затирать linux-бинарники и не тащить хостовые macOS-сборки).
  backend:
    build:
      context: ./backend
      target: dev
    container_name: ag_sound_calc_backend
    # Применяем миграции, затем поднимаем tsx watch.
    command: sh -c "npx prisma migrate deploy && npm run dev"
    environment:
      # hostname = имя сервиса postgres во внутренней docker-сети.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ag_sound_calc?schema=public
      PORT: "3006"
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174
      CALC_SERVICE_URL: https://dev3.constrtodo.ru:3005
      CALC_SERVICE_TIMEOUT_MS: "60000"
      # tsx watch использует chokidar — polling гарантирует ловлю изменений
      # в bind-mount на macOS/Windows (где fs-события иногда не доходят).
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3006:3006"
    volumes:
      - ./backend:/app
      - ag_sound_calc_backend_node_modules:/app/node_modules
      - ag_sound_calc_backend_puppeteer:/app/.cache/puppeteer
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend (vite dev server) в контейнере. Поднимается на http://localhost:5173.
  # Браузер с хоста ходит на API по http://localhost:3006 (опубликованный порт
  # backend, см. apiClient DEFAULT_BASE_URL). /uploads-прокси работает ВНУТРИ
  # контейнера → бьёт на backend по имени сервиса. node_modules — в named volume
  # (не затираем хостовые macOS-бинарники; внутри ставятся linux-сборки rollup/esbuild).
  frontend:
    image: node:20-bookworm-slim
    container_name: ag_sound_calc_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      BACKEND_PROXY_TARGET: http://backend:3006
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - ag_sound_calc_frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  # Веб-UI для базы. Поднимается на http://localhost:8080.
  # Логин: System=PostgreSQL, Server=postgres, User=postgres, Password=postgres, DB=ag_sound_calc.
  adminer:
    image: adminer:4
    container_name: ag_sound_calc_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ag_sound_calc_pg_data:
  ag_sound_calc_frontend_node_modules:
  ag_sound_calc_backend_node_modules:
  ag_sound_calc_backend_puppeteer:
