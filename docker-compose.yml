services:
  postgres:
    image: postgres:16
    container_name: ag_sound_calc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ag_sound_calc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ag_sound_calc_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ag_sound_calc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ag_sound_calc_pg_data:
